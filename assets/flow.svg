<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1460" viewBox="0 0 680 730" font-family="Inter, DejaVu Sans, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.l{stroke:#73726c;stroke-width:1.2;fill:none}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.p rect{fill:#EEEDFE;stroke:#534AB7}.p .th{fill:#3C3489}.p .ts{fill:#534AB7}.t rect{fill:#E1F5EE;stroke:#0F6E56}.t .th{fill:#085041}.t .ts{fill:#0F6E56}.g rect{fill:#F1EFE8;stroke:#888780}.g .th{fill:#2C2C2A}.g .ts{fill:#5F5E5A}.lab{font-size:12px;fill:#5F5E5A}rect{stroke-width:0.8}text{dominant-baseline:central;text-anchor:middle}</style></defs>
<rect width="680" height="730" fill="#ffffff"/>
<text class="lab" x="180" y="24" font-weight="500">WORKER TRACK</text>
<text class="lab" x="500" y="24" font-weight="500">VERIFIER TRACK (make-no-mistake)</text>
<g transform="translate(0,20)">
<g class="g"><rect x="240" y="30" width="200" height="44" rx="8"/><text class="th" x="340" y="52">Your prompt</text></g>
<path class="l" d="M340 74 L340 94 L180 94 L180 116" marker-end="url(#a)"/>
<path class="l" d="M340 94 L500 94 L500 116" marker-end="url(#a)"/>
<g class="p"><rect x="60" y="120" width="240" height="56" rx="8"/><text class="th" x="180" y="138">Worker builds</text><text class="ts" x="180" y="158">Code, script, render, doc</text></g>
<g class="t"><rect x="380" y="120" width="240" height="56" rx="8"/><text class="th" x="500" y="138">Verifier reads intent</text><text class="ts" x="500" y="158">Prompt + memory only</text></g>
<path class="l" d="M180 176 L180 206" marker-end="url(#a)"/>
<path class="l" d="M500 176 L500 206" marker-end="url(#a)"/>
<g class="p"><rect x="60" y="210" width="240" height="56" rx="8"/><text class="th" x="180" y="228">Output ready</text><text class="ts" x="180" y="248">Work claims it's done</text></g>
<g class="t"><rect x="380" y="210" width="240" height="56" rx="8"/><text class="th" x="500" y="228">Frozen checklist</text><text class="ts" x="500" y="248">3–7 pass/fail criteria</text></g>
<path class="l" d="M180 266 L180 286 L340 286 L340 306" marker-end="url(#a)"/>
<path class="l" d="M500 266 L500 286 L340 286"/>
<g class="t"><rect x="220" y="310" width="240" height="56" rx="8"/><text class="th" x="340" y="328">Scope gate</text><text class="ts" x="340" y="348">Cheap enough to check?</text></g>
<path class="l" d="M460 338 L486 338" marker-end="url(#a)"/><text class="lab" x="474" y="326">no</text>
<g class="g"><rect x="490" y="310" width="150" height="56" rx="8"/><text class="th" x="565" y="328">Ask user</text><text class="ts" x="565" y="348">Where's the issue?</text></g>
<path class="l" d="M565 366 L565 428 L464 428" marker-end="url(#a)"/>
<path class="l" d="M340 366 L340 396" marker-end="url(#a)"/><text class="lab" x="358" y="382">yes</text>
<g class="t"><rect x="220" y="400" width="240" height="56" rx="8"/><text class="th" x="340" y="418">Independent check</text><text class="ts" x="340" y="438">Run, test, cite proof</text></g>
<path class="l" d="M340 456 L340 486" marker-end="url(#a)"/>
<g class="t"><rect x="220" y="490" width="240" height="56" rx="8"/><text class="th" x="340" y="508">All criteria pass?</text><text class="ts" x="340" y="528">Against frozen checklist</text></g>
<path class="l" d="M220 518 L194 518" marker-end="url(#a)"/><text class="lab" x="206" y="506">no</text>
<g class="p"><rect x="40" y="490" width="150" height="56" rx="8"/><text class="th" x="115" y="508">Silent fix</text><text class="ts" x="115" y="528">Max 3 rounds</text></g>
<path class="l" d="M115 490 L115 428 L216 428" marker-end="url(#a)"/>
<path class="l" d="M115 546 L115 576" marker-end="url(#a)"/>
<g class="g"><rect x="40" y="580" width="150" height="56" rx="8"/><text class="th" x="115" y="598">Ask user</text><text class="ts" x="115" y="618">Stuck or unclear</text></g>
<path class="l" d="M340 546 L340 576" marker-end="url(#a)"/><text class="lab" x="358" y="562">yes</text>
<g class="g"><rect x="220" y="580" width="240" height="56" rx="8"/><text class="th" x="340" y="598">Done</text><text class="ts" x="340" y="618">One line: verified 7/7</text></g>
<rect x="196" y="668" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/><text class="lab" x="214" y="674" style="text-anchor:start">Worker (your AI)</text>
<rect x="340" y="668" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/><text class="lab" x="358" y="674" style="text-anchor:start">Make-no-mistake verifier</text>
</g>
</svg>
